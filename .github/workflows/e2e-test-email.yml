name: E2E — historical fixture render, live images and release guards (no email)
on:
  push:
    branches: [main]
    paths: [e2e_test_issue_2026-11-09.json, delivery_guard.py, final_freshness.py, editorial_scanning.py, render_minimal.py, minimal_template.html.j2, test_delivery_guard.py, test_freshness_scanning.py, test_discovery_sources.py, discovery_sources.json, .github/workflows/e2e-test-email.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering and image-validation dependencies
        run: python -m pip install 'Jinja2>=3.1.6,<4' 'Pillow>=11,<14'
      - name: Run newsletter and image regression tests
        run: python -m unittest test_minimal test_image_pipeline test_delivery_guard test_editorial_operations test_freshness_scanning test_discovery_sources
      - name: Audit discovery coverage and public Luma policy (no account or signup)
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlsplit
          d=json.load(open('discovery_sources.json'))
          s=d['sources']
          categories={x['category'].split('/')[0].strip() for x in s}
          domains={urlsplit(x['official_calendar_url']).hostname for x in s}
          assert len(s)>=28 and len(domains)>=12 and len(categories)>=5
          for id in ('lumen-project','fallan','fargfabriken','luma-stockholm','meetup-stockholm','tickster-stockholm'):
              assert any(x['id']==id for x in s),id
          assert not any(x['id']=='slakthusen' for x in s)
          print('DISCOVERY REGISTRY VERIFIED:',len(s),'sources;',len(domains),'domains;',len(categories),'category labels')
          PY
      - name: Render archived fixture and validate real image links plus honest fallback
        run: |
          python image_pipeline.py --data e2e_test_issue_2026-11-09.json --report e2e-image-audit.json
          python render_minimal.py --data e2e_test_issue_2026-11-09.json --output e2e-test-email.html
          python - <<'PY'
          import json
          from html.parser import HTMLParser
          from image_pipeline import validate_photo
          g=json.load(open("e2e_test_issue_2026-11-09.json"))
          h=open("e2e-test-email.html").read()
          class Structure(HTMLParser):
              def __init__(self):
                  super().__init__();self.images=[];self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="img":self.images.append(a.get("src",""))
                  if tag=="a":self.links.append((a.get("class",""),a.get("href","")))
          p=Structure();p.feed(h)
          assert h.count("background:#161616;")==4, "Black section strips missing"
          assert h.count('class="top-thumb-link"')==3, "Thumbnail click targets missing"
          assert h.count('class="event-card-link"')==12, "Full item links missing"
          assert len([l for l in p.links if "feedback-link" in l[0]])==3
          live_images = 0
          for event in g["top3"]:
              if not event.get("image_verified"):
                  assert "image_url" not in event, "Archived image must not silently remain linked"
                  continue
              image_url=event["image_url"]
              if event.get("image_cache_file"):
                  image_url="https://fixingman.github.io/stockholm-guide/assets/"+event["image_cache_file"]
              assert image_url in p.images, "Missing featured image in rendered HTML"
              _,_,actual,dim=validate_photo(image_url)
              live_images += 1
              print("VALID IMAGE:",event["title"],actual,dim)
          assert live_images == 2, f"Expected two verified images in archival fixture, got {live_images}"
          assert h.count('aria-label="No verified event photo available"') == 1, "Missing honest fallback for invalid archived image"
          assert "<script" not in h.lower()
          print("E2E VERIFIED: 4 strips, 3 thumbnail slots, 12 linked editorial rows, 3 feedback links, two live images and one honest archival fallback.")
          PY
      - name: Check exact rendered HTML and anonymous image loads
        run: python delivery_guard.py --data e2e_test_issue_2026-11-09.json --html e2e-test-email.html --manifest e2e-delivery-manifest.json --network
      - name: Assert subscriber release rejects archival fallback and Gmail MIME round trip is exact (no email sent)
        run: |
          python - <<'PY'
          import json
          from email.message import EmailMessage
          from pathlib import Path
          from delivery_guard import assess, extract_html_from_mime, verify_sent_html
          g=json.loads(Path('e2e_test_issue_2026-11-09.json').read_text())
          html=Path('e2e-test-email.html').read_text()
          manifest=json.loads(Path('e2e-delivery-manifest.json').read_text())
          assert manifest['ready_for_delivery'] and manifest['inline_fallbacks']==1 and len(manifest['featured_images'])==2
          forbidden=assess(g,html,network=False,require_featured_photos=True)
          assert not forbidden['ready_for_delivery']
          assert any('Production image-quality gate' in msg for msg in forbidden['errors'])
          msg=EmailMessage();msg['Subject']='[TEST] Offline fixture only';msg.set_content('Text fallback');msg.add_alternative(html,subtype='html')
          embedded=extract_html_from_mime(msg.as_bytes())
          assert verify_sent_html(embedded,manifest)['matched']
          assert not verify_sent_html(embedded+'<!-- changed -->',manifest)['matched']
          print('PASS: 2 live images / 1 archival fallback; production refuses; MIME digest matches; tampering rejected; no recipients')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-e2e-email-and-image-audit
          path: |
            e2e-test-email.html
            e2e-image-audit.json
            e2e-delivery-manifest.json
          retention-days: 7
