name: E2E — historical fixture render, live images and release guards (no email)
on:
  push:
    branches: [main]
    paths: [e2e_test_issue_2026-11-09.json, delivery_guard.py, final_freshness.py, editorial_scanning.py, render_minimal.py, minimal_template.html.j2, test_delivery_guard.py, test_freshness_scanning.py, test_discovery_sources.py, test_release_authorization.py, release_authorization.py, editorial_quality.py, test_editorial_operations.py, issues/featured-history.json, email_client_qa.py, discovery_sources.json, optimize_issue_images.py, test_optimize_issue_images.py, image_pipeline.py, build_calendar.py, calendar_template.html.j2, calendar.js, calendar.css, test_calendar.py, test_minimal.py, .github/workflows/e2e-test-email.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering and image-validation dependencies
        run: |
          python -m pip install 'Jinja2>=3.1.6,<4' 'Pillow>=11,<14' 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Run newsletter and image regression tests
        run: python -m unittest test_minimal test_image_pipeline test_optimize_issue_images test_delivery_guard test_editorial_operations test_freshness_scanning test_discovery_sources test_release_authorization test_calendar
      - name: Validate maintained public calendar integration (no email)
        run: |
          node --check calendar.js
          python build_calendar.py --data issues/current.json --output calendar.html
          python - <<'PY'
          from pathlib import Path
          html = Path("calendar.html").read_text()
          assert "fullcalendar@6.1.22/index.global.min.js" in html
          assert 'id="fullcalendar"' in html
          assert "calendar-data" in html
          assert "CHIMERA" in html
          print("PASS: Current issue calendar renders with FullCalendar and no subscriber data")
          PY
      - name: Browser smoke test — real FullCalendar month, list, filters and mobile
        run: |
          python - <<'PY'
          import subprocess,sys,time
          from playwright.sync_api import sync_playwright
          server=subprocess.Popen([sys.executable,"-m","http.server","8765","--bind","127.0.0.1"],
              stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          try:
              time.sleep(1)
              with sync_playwright() as playwright:
                  browser=playwright.chromium.launch(headless=True)
                  page=browser.new_page(viewport={"width":1100,"height":850})
                  page.goto("http://127.0.0.1:8765/calendar.html",wait_until="load",timeout=60000)
                  page.locator(".fc-daygrid").wait_for(timeout=30000)
                  assert page.locator(".fc-daygrid-event").count() >= 3, "No real issue events in FullCalendar"
                  page.get_by_role("button",name="All events").click()
                  page.locator(".fc-list").wait_for(timeout=20000)
                  page.get_by_role("button",name="Top picks").click()
                  assert page.locator(".fc-list-event").count()==3, "Top Picks filter did not show exactly three"
                  page.get_by_role("button",name="Calendar",exact=True).click()
                  page.locator(".fc-daygrid").wait_for(timeout=10000)
                  # Load from scratch at phone width: FullCalendar's resize
                  # is debounced and an immediate post-resize screenshot is stale.
                  page.set_viewport_size({"width":390,"height":844})
                  page.reload(wait_until="load",timeout=60000)
                  page.locator(".fc-daygrid").wait_for(timeout=30000)
                  page.wait_for_timeout(450)
                  days=page.locator(".fc-col-header-cell")
                  assert days.count()==7, "Expected all seven weekdays"
                  left=days.first.bounding_box()
                  right=days.last.bounding_box()
                  assert left and right and left["x"]>=0 and right["x"]+right["width"]<=393, "Clipped weekday columns on mobile"
                  assert page.locator(".fc-daygrid-event").count()>=3, "No calendar events on mobile"
                  page.screenshot(path="calendar-mobile.png",full_page=True)
                  assert page.evaluate("document.documentElement.scrollWidth <= window.innerWidth + 3"), "Mobile horizontal overflow"
                  browser.close()
          finally:
              server.terminate()
              server.wait(timeout=15)
          print("PASS: FullCalendar real browser month, agenda, 3 top picks, responsive layout")
          PY
      - name: Real-world photo performance probe (official source, no sending)
        run: |
          python - <<'PY'
          import json
          from optimize_issue_images import optimize_entry
          photo = {
              "title": "TEST-007 Accelerator large photograph",
              "image_verified": True,
              "image_url": "https://acceleratorsu.art/wp-content/uploads/2024/03/Ester_Bergsmark-face-1.jpg",
          }
          result = optimize_entry(photo)
          result["original_url"] = photo.get("image_original_url", photo["image_url"])
          print("PHOTO PERFORMANCE:", json.dumps(result, ensure_ascii=False))
          with open("photo-optimization-probe.json", "w") as f:
              json.dump(result, f, indent=2)
          if result["status"] == "optimized":
              assert "image_original_url" in photo
              assert photo["image_url"] != photo["image_original_url"]
          else:
              assert "image_original_url" not in photo, "Non-optimized photo was altered"
          PY
      - name: Audit discovery coverage and public Luma policy (no account or signup)
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlsplit
          d=json.load(open('discovery_sources.json'))
          s=d['sources']
          categories={x['category'].split('/')[0].strip() for x in s}
          domains={urlsplit(x['official_calendar_url']).hostname for x in s}
          assert len(s)>=28 and len(domains)>=12 and len(categories)>=5
          for id in ('lumen-project','fallan','fargfabriken','luma-stockholm','meetup-stockholm','tickster-stockholm'):
              assert any(x['id']==id for x in s),id
          assert not any(x['id']=='slakthusen' for x in s)
          print('DISCOVERY REGISTRY VERIFIED:',len(s),'sources;',len(domains),'domains;',len(categories),'category labels')
          PY
      - name: Render archived fixture and validate real image links plus honest fallback
        run: |
          python image_pipeline.py --data e2e_test_issue_2026-11-09.json --report e2e-image-audit.json
          python render_minimal.py --data e2e_test_issue_2026-11-09.json --output e2e-test-email.html
          python - <<'PY'
          import json
          from html.parser import HTMLParser
          from image_pipeline import validate_photo
          g=json.load(open("e2e_test_issue_2026-11-09.json"))
          h=open("e2e-test-email.html").read()
          class Structure(HTMLParser):
              def __init__(self):
                  super().__init__();self.images=[];self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="img":self.images.append(a.get("src",""))
                  if tag=="a":self.links.append((a.get("class",""),a.get("href","")))
          p=Structure();p.feed(h)
          assert h.count("background:#161616;")==4, "Black section strips missing"
          assert h.count('class="top-thumb-link"')==3, "Thumbnail click targets missing"
          assert h.count('class="event-card-link"')==12, "Full item links missing"
          assert len([l for l in p.links if "feedback-link" in l[0]])==3
          live_images = 0
          for event in g["top3"]:
              if not event.get("image_verified"):
                  assert "image_url" not in event, "Archived image must not silently remain linked"
                  continue
              image_url=event["image_url"]
              if event.get("image_cache_file"):
                  image_url="https://fixingman.github.io/stockholm-guide/assets/"+event["image_cache_file"]
              assert image_url in p.images, "Missing featured image in rendered HTML"
              _,_,actual,dim=validate_photo(image_url)
              live_images += 1
              print("VALID IMAGE:",event["title"],actual,dim)
          assert live_images == 2, f"Expected two verified images in archival fixture, got {live_images}"
          assert h.count('aria-label="No verified event photo available"') == 1, "Missing honest fallback for invalid archived image"
          assert "<script" not in h.lower()
          print("E2E VERIFIED: 4 strips, 3 thumbnail slots, 12 linked editorial rows, 3 feedback links, two live images and one honest archival fallback.")
          PY
      - name: Check exact rendered HTML and anonymous image loads
        run: python delivery_guard.py --data e2e_test_issue_2026-11-09.json --html e2e-test-email.html --manifest e2e-delivery-manifest.json --network
      - name: Assert subscriber release rejects archival fallback and Gmail MIME round trip is exact (no email sent)
        run: |
          python - <<'PY'
          import json
          from email.message import EmailMessage
          from pathlib import Path
          from delivery_guard import assess, extract_html_from_mime, verify_sent_html
          g=json.loads(Path('e2e_test_issue_2026-11-09.json').read_text())
          html=Path('e2e-test-email.html').read_text()
          manifest=json.loads(Path('e2e-delivery-manifest.json').read_text())
          assert manifest['ready_for_delivery'] and manifest['inline_fallbacks']==1 and len(manifest['featured_images'])==2
          forbidden=assess(g,html,network=False,require_featured_photos=True)
          assert not forbidden['ready_for_delivery']
          assert any('Production image-quality gate' in msg for msg in forbidden['errors'])
          msg=EmailMessage();msg['Subject']='[TEST] Offline fixture only';msg.set_content('Text fallback');msg.add_alternative(html,subtype='html')
          embedded=extract_html_from_mime(msg.as_bytes())
          assert verify_sent_html(embedded,manifest)['matched']
          assert not verify_sent_html(embedded+'<!-- changed -->',manifest)['matched']
          print('PASS: 2 live images / 1 archival fallback; production refuses; MIME digest matches; tampering rejected; no recipients')
          PY
      - name: Negative visual E2E — archived fallback must NEVER pass release visuals
        run: |
          python - <<'PY'
          import json,subprocess,sys
          result=subprocess.run([sys.executable,"email_client_qa.py",
              "--html","e2e-test-email.html","--visual",
              "--report","e2e-rejected-visual.json","--screenshots","visual-rejection-screenshots"])
          report=json.load(open("e2e-rejected-visual.json"))
          assert result.returncode != 0, "BUG: fallback passed images-enabled QA"
          assert len(report["visual_scenarios"]) == 3, "Expected actual browser runs, not setup failure"
          assert report["static"]["ok"] and not report["ok"]
          assert all(x["fallbackCount"]==1 and not x["ok"] for x in report["visual_scenarios"])
          print("PASS: old fallback fixture explicitly REJECTED by live browser visual gate")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-e2e-email-and-image-audit
          path: |
            e2e-test-email.html
            e2e-image-audit.json
            photo-optimization-probe.json
            calendar-mobile.png
            e2e-delivery-manifest.json
            e2e-rejected-visual.json
            visual-rejection-screenshots/
          retention-days: 7
