name: E2E test — fresh newsletter render (no recipients)
on:
  push:
    branches: [main]
    paths: [e2e_test_issue_2026-11-09.json, .github/workflows/e2e-test-email.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering and image-validation dependencies
        run: python -m pip install 'Jinja2>=3.1.6,<4' 'Pillow>=11,<14'
      - name: Run newsletter and image regression tests
        run: python -m unittest test_minimal test_image_pipeline test_delivery_guard
      - name: Validate three fresh issue images, audit, render actual template
        run: |
          python image_pipeline.py --data e2e_test_issue_2026-11-09.json --report e2e-image-audit.json
          python render_minimal.py --data e2e_test_issue_2026-11-09.json --output e2e-test-email.html
          python - <<'PY'
          import json
          from html.parser import HTMLParser
          from image_pipeline import validate_photo
          g=json.load(open("e2e_test_issue_2026-11-09.json"))
          h=open("e2e-test-email.html").read()
          class Structure(HTMLParser):
              def __init__(self):
                  super().__init__();self.images=[];self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="img":self.images.append(a.get("src",""))
                  if tag=="a":self.links.append((a.get("class",""),a.get("href","")))
          p=Structure();p.feed(h)
          assert h.count("background:#161616;")==4, "Black section strips missing"
          assert h.count('class="top-thumb-link"')==3, "Thumbnail click targets missing"
          assert h.count('class="event-card-link"')==12, "Full item links missing"
          assert len([l for l in p.links if "feedback-link" in l[0]])==3
          for event in g["top3"]:
              assert event.get("image_verified")
              image_url=event["image_url"]
              if event.get("image_cache_file"):
                  image_url="https://fixingman.github.io/stockholm-guide/assets/"+event["image_cache_file"]
              assert image_url in p.images, "Missing featured image in rendered HTML"
              _,_,actual,dim=validate_photo(image_url)
              print("VALID IMAGE:",event["title"],actual,dim)
          assert "<script" not in h.lower()
          print("E2E VERIFIED: 4 black section strips, 3 image links, 12 clickable editorial rows, 3 feedback links.")
          PY
      - name: Check exact rendered HTML and anonymous image loads
        run: python delivery_guard.py --data e2e_test_issue_2026-11-09.json --html e2e-test-email.html --manifest e2e-delivery-manifest.json --network
      - name: Save generated HTML to isolated file for Gmail delivery
        run: |
          git config user.name "stockholm-guide-bot"
          git config user.email "stockholm-guide-bot@users.noreply.github.com"
          git add e2e-test-email.html
          if ! git diff --cached --quiet; then
            git commit -m "Build isolated E2E test newsletter HTML [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-e2e-email-and-image-audit
          path: |
            e2e-test-email.html
            e2e-image-audit.json
            e2e-delivery-manifest.json
          retention-days: 7
