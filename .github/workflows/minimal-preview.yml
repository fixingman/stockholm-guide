name: Preview alternate minimal editorial layout
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'Jinja2>=3.1.6,<4' 'Pillow>=11,<14'
      - run: python -m unittest test_minimal test_image_pipeline
      - name: Generate alternate newsletter HTML
        run: |
          python render_minimal.py --output minimal-preview.html
      - uses: actions/upload-artifact@v6
        with:
          name: minimal-editorial-preview
          path: minimal-preview.html
          retention-days: 14
