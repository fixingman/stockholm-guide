name: Editorial-to-calendar pipeline regression (no email)
on:
  pull_request:
    paths:
      - build_calendar.py
      - test_calendar.py
      - discovery_sources.json
      - source_coverage.py
      - test_source_coverage.py
      - calendar.js
      - calendar_template.html.j2
      - .github/workflows/calendar-pipeline-regression.yml
  push:
    branches: [main]
    paths:
      - build_calendar.py
      - test_calendar.py
      - calendar.js
      - calendar_template.html.j2
      - .github/workflows/calendar-pipeline-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-calendar-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install calendar rendering dependencies
        run: python -m pip install 'Jinja2>=3.1.6,<4'
      - name: Source review and calendar selection regression
        run: python -m unittest test_calendar test_source_coverage test_discovery_sources
      - name: Calendar JavaScript syntax and actual current issue render
        run: |
          node --check calendar.js
          python build_calendar.py --data issues/current.json --output calendar.html
          test -s calendar.html
          grep -q 'calendar-data' calendar.html
          grep -q 'calendar_only_events' calendar.html
      - name: Assert no Gmail or subscriber actions in this workflow
        run: echo 'Public read-only calendar test; no email sending or subscriber access'
