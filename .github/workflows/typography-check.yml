name: Verify email typography and content
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Jinja2>=3.1.6,<4'
      - run: python -m unittest test_render test_typography test_design_variant test_image_compat
      - run: python render.py --output /tmp/typography-preview.html
