name: Sweep every registered public source (no email)
on:
  schedule:
    # Run ahead of Saturday 15:00 and Sunday 09:00 Stockholm automations.
    # UTC cron cannot adjust for DST; both finish before the local task.
    - cron: '10 12 * * 6'
    - cron: '10 5 * * 0'
  push:
    branches: [main]
    paths:
      - source_sweep.py
      - source_browser_sweep.py
      - source_review_checklist.py
      - source_coverage.py
      - test_source_coverage.py
      - test_discovery_sources.py
      - discovery_sources.json
      - .github/workflows/source-sweep.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: registered-sources-probe
  cancel-in-progress: false
jobs:
  public-index-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate 100% source accounting rules (offline)
        run: python -m unittest test_source_coverage test_discovery_sources
      - name: Attempt every official public source and configured category page
        run: |
          python source_sweep.py --registry discovery_sources.json --output /tmp/source-probe.json --workers 7 --timeout 12 --retries 2
          python - <<'PY'
          import json
          r=json.load(open("/tmp/source-probe.json"))
          assert r["registered_count"] == r["attempted_count"]
          assert r["registered_count"] == len(r["sources"])
          assert r["editorially_reviewed_count"] == 0, "A network index probe is not an editorial review"
          assert len({s["source_id"] for s in r["sources"]}) == r["registered_count"]
          luma=next(s for s in r["sources"] if s["source_id"]=="luma-stockholm")
          assert len(luma["attempted_urls"]) >= 3, "Luma categories must be included"
          print("FULL REGISTRY PROBED:",r["attempted_count"],
                "reachable:",r["index_reachable_count"],
                "inaccessible:",r["index_unavailable_count"],
                "unverified public leads:",r["total_discovered_links"])
          PY
      - name: Add read-only Chromium extraction for Luma and other JS-heavy calendars
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
          python source_browser_sweep.py --probe /tmp/source-probe.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/source-probe.json"))
          assert p["attempted_count"] == p["registered_count"]
          assert p["editorially_reviewed_count"] == 0
          print("Public browser-enriched sources:",p["browser_enriched_count"])
          print("Unverified candidate links:",p["total_discovered_links"])
          PY
      - name: Produce 100% source checklist for Saturday editorial handoff
        run: |
          python source_review_checklist.py --registry discovery_sources.json --probe /tmp/source-probe.json --output /tmp/source-review-checklist.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/source-review-checklist.json"))
          assert d["registry_count"] == d["accounted_for_count"] == len(d["rows"])
          assert d["editorially_reviewed_count"] == 0
          assert all(x["status"]=="NOT_REVIEWED" for x in d["rows"])
          print("COMPLETE EDITORIAL HANDOFF TEMPLATE:",len(d["rows"]),"unreviewed sources")
          PY
      - name: Summarize all attempted sources without calling them reviewed
        run: |
          python - <<'PY'
          import json,os
          result=json.load(open("/tmp/source-probe.json"))
          lines=[
            "# Stockholm Guide — Full public source probe",
            f"**{result['attempted_count']}/{result['registered_count']} sources attempted** — "
            f"{result['index_reachable_count']} indexes reachable; "
            f"{result['index_unavailable_count']} inaccessible; "
            f"{result['total_discovered_links']} unverified leads.",
            "",
            "> Index loading is not editorial verification. Every source requires a separate source_scans review before release.",
            "",
            "| Source | Probe status | Leads |",
            "|:--|:--|--:|"
          ]
          for src in result["sources"]:
              lines.append(f"| {src['source_id']} | {src['probe_status']} | {len(src['candidate_links'])} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("\n".join(lines)+"\n")
          PY
      - name: Upload complete timestamped source probe
        uses: actions/upload-artifact@v6
        with:
          name: public-source-probe-all-registered
          path: |
            /tmp/source-probe.json
            /tmp/source-review-checklist.json
          retention-days: 21
      - name: Update separate public source-audit branch for Saturday and Sunday editorial agents
        run: |
          git config user.name stockholm-guide-bot
          git config user.email stockholm-guide-bot@users.noreply.github.com
          git fetch origin source-audit
          git switch -C source-audit origin/source-audit
          mkdir -p research
          cp /tmp/source-probe.json research/source-probe.json
          cp /tmp/source-review-checklist.json research/source-review-checklist.json
          git add research/source-probe.json research/source-review-checklist.json
          if ! git diff --cached --quiet; then
            git commit -m "Public sweep of all registered source calendars [skip ci]"
            git push origin HEAD:source-audit
          fi
