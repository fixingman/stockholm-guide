name: Node.js 24 action runtime compatibility (no email)
on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-node24-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prove all workflow action refs are upgraded
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          # Only inspect real action declarations. Documentation, comments,
          # and regression fixtures containing old-version strings are not uses.
          def action_refs(content):
              return re.findall(r'^\\s*-\\s*uses:\\s*([^\\s#]+)', content, re.MULTILINE)

          minimum = {
              'actions/checkout': 5,
              'actions/setup-python': 6,
              'actions/upload-artifact': 6,
          }
          # Sanity-check the scanner: it must reject real old uses but never
          # flag explanatory strings inside Python steps or YAML comments.
          assert action_refs('# actions/checkout@v4\\nprint("actions/setup-python@v5")') == []
          assert action_refs('      - uses: actions/checkout@v4') == ['actions/checkout@v4']

          files = sorted(Path('.github/workflows').glob('*.yml'))
          actual = [(str(p), ref) for p in files for ref in action_refs(p.read_text())]
          stale = []
          for path, ref in actual:
              name, sep, version = ref.partition('@')
              if name not in minimum:
                  continue
              match = re.fullmatch(r'v(\\d+)(?:\\..*)?', version)
              if not sep or not match or int(match.group(1)) < minimum[name]:
                  stale.append((path, ref))
          print(f'Checked {len(actual)} uses declarations in {len(files)} workflow files')
          assert not stale, f'Outdated action versions in actual uses declarations: {stale}'
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              Path(summary).open('a').write(
                  f'### Action runtime compatibility: PASS\\n'
                  f'Checked {len(actual)} actual uses declarations across {len(files)} workflows.\\n'
                  'No outdated checkout/setup-python/upload-artifact majors.\\n'
              )
          Path('node24-ci-smoke.txt').write_text(
              f'PASS: {len(actual)} actual uses declarations across {len(files)} workflows\\n'
          )
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: node24-action-smoke
          path: node24-ci-smoke.txt
