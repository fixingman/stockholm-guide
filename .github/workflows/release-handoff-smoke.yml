name: Smoke test validated Sunday handoff (NO EMAIL)
on:
  push:
    branches: [main]
    paths:
      - publish_verified_release.sh
      - .github/workflows/release-handoff-smoke.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install 'Jinja2>=3.1.6,<4' 'Pillow>=11,<14'
      - name: Create test-only HTML using distinct pre-existing dated fixture
        run: |
          mkdir -p smoke-release
          python render_minimal.py --data e2e_test_issue_2026-11-09.json --output smoke-release/outgoing.html
          python delivery_guard.py --data e2e_test_issue_2026-11-09.json --html smoke-release/outgoing.html --manifest smoke-release/delivery-manifest.json
          cp e2e_test_issue_2026-11-09.json smoke-release/issue.json
      - name: Publish isolated test fixture on smoke-only branch
        run: bash publish_verified_release.sh smoke-release smoke
      - name: Confirm published branch has exactly tested HTML and manifest
        run: |
          git fetch origin validated-sunday-smoke
          git show FETCH_HEAD:verified/outgoing.html > /tmp/published.html
          git show FETCH_HEAD:verified/delivery-manifest.json > /tmp/published-manifest.json
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from delivery_guard import html_digest
          html=Path('/tmp/published.html').read_text()
          m=json.loads(Path('/tmp/published-manifest.json').read_text())
          assert m['smoke_test_only'] is True and m['release_channel']=='smoke'
          assert html_digest(html)==m['html_sha256']
          assert html == Path('smoke-release/outgoing.html').read_text()
          print('PASS: GitHub artifact branch contains the exact validated issue HTML, no email involved')
          PY
