name: Research genuine featured photo candidates (no sending)
on:
  push:
    branches: [main]
    paths:
      - photo_candidate_research.py
      - .github/workflows/photo-candidate-research.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-public-organizer-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install editorial photo inspector
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5' 'Pillow>=11,<14'
      - name: Find exact-page official image candidates (not an identity approval)
        run: python photo_candidate_research.py
      - uses: actions/upload-artifact@v6
        with:
          name: organizer-photo-research
          path: photo-candidates.json
          retention-days: 7
