name: Publish Stockholm Guide preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prevent private subscriber/consent files from entering public repository
        run: |
          python - <<'PY'
          import re, subprocess
          tracked=subprocess.check_output(["git","ls-files"],text=True).splitlines()
          private=re.compile(r"(^|/)(private|[.]private)/|(^|/)(subscribers?|recipients?|suppression|consent)[^/]*[.](json|csv|tsv|txt)$",re.I)
          leaks=[path for path in tracked if private.search(path)]
          if leaks:
              raise SystemExit("Private subscriber records are tracked: "+", ".join(leaks))
          print("Subscriber privacy file policy: PASSED")
          PY
      - name: Build tokenized preview from canonical template
        run: |
          python -m pip install 'Jinja2>=3.1.6,<4' 'Pillow>=11,<14'
          python render.py --data guide_data.json --output preview.html
          cp preview.html index.html
          python render.py --data guide_data.json --output email.html --asset-base-url https://fixingman.github.io/stockholm-guide/assets
          # Legacy design tests target the frozen issue-001 fixture, not the weekly Minimal Editorial issue.
      - name: Build merged minimal-layout preview with reader feedback
        run: |
          mkdir -p minimal-experiment
          python render_minimal.py --data guide_data.json --output minimal-experiment/index.html
          python -m unittest test_minimal test_image_pipeline test_delivery_guard test_editorial_operations test_freshness_scanning
          python editorial_quality.py --data guide_data.json --report sample-editorial-quality.json
          python delivery_guard.py --data guide_data.json --html minimal-experiment/index.html --manifest minimal-delivery-manifest.json
          python email_client_qa.py --html minimal-experiment/index.html --report email-client-qa.json
      - name: Commit rendered minimal email for delivery
        run: |
          cp minimal-experiment/index.html latest-minimal-email.html
          git config user.name "stockholm-guide-bot"
          git config user.email "stockholm-guide-bot@users.noreply.github.com"
          git add latest-minimal-email.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish rendered minimal issue [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
