name: Publish Stockholm Guide preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prevent private subscriber/consent files from entering public repository
        run: |
          python - <<'PY'
          import re, subprocess
          tracked=subprocess.check_output(["git","ls-files"],text=True).splitlines()
          private=re.compile(r"(^|/)(private|[.]private)/|(^|/)(subscribers?|recipients?|suppression|consent)[^/]*[.](json|csv|tsv|txt)$",re.I)
          leaks=[path for path in tracked if private.search(path)]
          if leaks:
              raise SystemExit("Private subscriber records are tracked: "+", ".join(leaks))
          print("Subscriber privacy file policy: PASSED")
          PY
      - name: Build tokenized preview from canonical template
        run: |
          python -m pip install 'Jinja2>=3.1.6,<4' 'Pillow>=11,<14'
          python render.py --data guide_data.json --output preview.html
          cp preview.html index.html
          python render.py --data guide_data.json --output email.html --asset-base-url https://fixingman.github.io/stockholm-guide/assets
          # Legacy design tests target the frozen issue-001 fixture, not the weekly Minimal Editorial issue.
      - name: Build merged minimal-layout preview with reader feedback
        run: |
          mkdir -p minimal-experiment
          python render_minimal.py --data guide_data.json --output minimal-experiment/index.html
          python -m unittest test_minimal test_image_pipeline test_delivery_guard test_editorial_operations test_freshness_scanning
          python editorial_quality.py --data guide_data.json --report sample-editorial-quality.json
          python delivery_guard.py --data guide_data.json --html minimal-experiment/index.html --manifest minimal-delivery-manifest.json
          python email_client_qa.py --html minimal-experiment/index.html --report email-client-qa.json
      - name: Build the live issue calendar (public dates, no subscribers)
        run: |
          python -m unittest test_calendar test_calendar_ical
          node --check calendar.js
          python build_calendar.py --data issues/current.json --output calendar.html --feed-file calendar.ics --events-dir calendar-events
          python calendar_ical.py --data issues/current.json --output calendar.ics --events-dir calendar-events
          python build_calendar.py --data issues/owner-rehearsal-2026-11-22.json --output owner-issue-005-calendar.html --feed-file owner-issue-005-calendar.ics --events-dir owner-issue-005-events
          python calendar_ical.py --data issues/owner-rehearsal-2026-11-22.json --output owner-issue-005-calendar.ics --events-dir owner-issue-005-events
          test -s owner-issue-005-calendar.html
          test -s calendar.ics
          test -s owner-issue-005-calendar.ics
          test "$(find calendar-events -name '*.ics' | wc -l)" -gt 0
          python - <<'PY'
          from pathlib import Path
          for path in ('calendar.ics','owner-issue-005-calendar.ics'):
              feed=Path(path).read_bytes()
              assert feed.startswith(b'BEGIN:VCALENDAR\r\n') and feed.endswith(b'END:VCALENDAR\r\n')
              assert b'BEGIN:VEVENT' in feed
              print(path, 'ready, dated VEVENTs:', feed.count(b'BEGIN:VEVENT'))
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          from build_calendar import build_data
          issue=json.loads(Path('issues/owner-rehearsal-2026-11-22.json').read_text())
          result=build_data(issue)
          assert result['event_count']==32
          assert result['window_start']=='2026-11-22' and result['window_end']=='2026-12-05'
          assert result['event_count'] == sum(len(issue.get(section, [])) for section in ('top3','new_discoveries','worth_reconsidering','calendar_only_events'))
          assert len(issue['calendar_only_events']) >= 1, 'Owner expanded calendar pool cannot be empty'
          print('Owner-only Issue 005 calendar preview:', result['event_count'], 'total events,', len(issue['calendar_only_events']), 'extras; correct dates')
          PY
          test -s calendar.html
          test -s calendar.js
          test -s calendar.css
          python - <<'PY'
          from pathlib import Path
          html=Path("calendar.html").read_text()
          assert "calendar-data" in html and "calendar.js" in html
          assert "CHIMERA" in html or "application/json" in html
          print("Current issue calendar built without private records")
          PY
      - name: Commit rendered minimal email for delivery
        run: |
          cp minimal-experiment/index.html latest-minimal-email.html
          git config user.name "stockholm-guide-bot"
          git config user.email "stockholm-guide-bot@users.noreply.github.com"
          git add latest-minimal-email.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish rendered minimal issue [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub may briefly delay indexing a freshly uploaded Pages artifact.
      # Retain the actual deploy-pages gate; never report preview success unless it succeeds.
      - name: Allow Pages artifact indexing
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
