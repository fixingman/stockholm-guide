name: Publish Stockholm Guide preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build tokenized preview from canonical template
        run: |
          python -m pip install 'Jinja2>=3.1.6,<4'
          python render.py --data guide_data.json --output preview.html
          cp preview.html index.html
          python render.py --data guide_data.json --output email.html --asset-base-url https://fixingman.github.io/stockholm-guide/assets
          python -m unittest test_render test_typography test_design_variant test_image_compat
      - name: Check out minimal editorial experiment (without changing primary template)
        uses: actions/checkout@v4
        with:
          ref: experiment/minimal-editorial
          path: _minimal_experiment_source
          persist-credentials: false
      - name: Build a separate public minimal-layout preview
        run: |
          mkdir -p minimal-experiment
          python _minimal_experiment_source/render_minimal.py --data _minimal_experiment_source/guide_data.json --output minimal-experiment/index.html
          python -m unittest discover -s _minimal_experiment_source -p 'test_minimal.py'
          rm -rf _minimal_experiment_source
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
