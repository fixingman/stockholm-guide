name: Verified editorial event pool regression (no email)
on:
  pull_request:
    branches: [main]
    paths:
      - editorial_pool_audit.py
      - test_editorial_pool_audit.py
      - .github/workflows/owner-fullsource-rehearsal.yml
      - .github/workflows/weekly-release-gate.yml
      - .github/workflows/editorial-pool-regression.yml
      - issues/owner-rehearsal-2026-11-22.json
  push:
    branches: [main]
    paths:
      - editorial_pool_audit.py
      - test_editorial_pool_audit.py
      - .github/workflows/editorial-pool-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-verified-pool-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify source-to-verified-pool-to-output regression tests
        run: python -m unittest test_editorial_pool_audit
      - name: Demonstrate that the original published Issue 005 is rejected as an owner full-source rehearsal
        run: |
          if python editorial_pool_audit.py --issue issues/current.json --comparison issues/current.json --report /tmp/known-bad-report.json; then
            echo 'ERROR: Original unchanged Issue 005 incorrectly passed'
            exit 1
          fi
          python - <<'PY'
          import json
          r=json.load(open('/tmp/known-bad-report.json'))
          assert not r['ok'] and r['errors']
          assert any('reuses ALL' in e for e in r['errors'])
          assert any('calendar-only' in e for e in r['errors'])
          print('Original sent issue rejected as full-source owner rehearsal')
          PY
      - name: Require ACTUAL revised owner issue to differ and reconcile events across email and calendar
        run: |
          python editorial_pool_audit.py --issue issues/owner-rehearsal-2026-11-22.json --comparison issues/current.json --report /tmp/rebuilt-owner-report.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/rebuilt-owner-report.json'))
          assert r['ok']
          assert r['new_vs_reference']>=5, 'Rebuild needs multiple genuine new original event URLs'
          assert r['calendar_only']>=3, 'Calendar must include verified non-newsletter events'
          print('Actual owner rebuild has',r['newsletter'],'newsletter events,',r['calendar_only'],'calendar-only events,',r['new_vs_reference'],'new event URLs')
          PY
